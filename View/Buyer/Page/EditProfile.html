<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>MiniMart - Edit Profile</title>
        <link rel="stylesheet" href="../Design/Style.css">
    </head>
    <body>
        <div class="saleBar">New Year sale | 44% Off</div>

        <div class="header">
            <div class="logo">Arabi</div>
            <div class="nav">
                <a href="BuyerDashboard.html">Dashboard</a>
                <a href="MyOrders.html">My Orders</a>
                <a href="Cart.html">Cart</a>
            </div>
        </div>

        <div class="smallContainer">
            <p class="smallText">MY ACCOUNT</p>
            <h1>Edit Profile</h1>

            <div class="profileSection">
                <h3>Personal Information</h3>
                <form>
                    <table>
                        <tr>
                            <td><label for="name">Full Name:</label></td>
                            <td><input type="text" id="name" name="name"></td>
                        </tr>
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td><input type="email" id="email" name="email" ></td>
                        </tr>
                        <tr>
                            <td><label for="phone">Phone:</label></td>
                            <td><input type="text" id="phone" name="phone" ></td>
                        </tr>
                    </table>
                    <input type="submit" value="SAVE">
                </form>
            </div>

            <div class="profileSection">
                <h3>Change Password</h3>
                <form>
                    <table>
                        <tr>
                            <td><label for="currentPassword">Current Password:</label></td>
                            <td><input type="password" id="currentPassword" name="currentPassword"></td>
                        </tr>
                        <tr>
                            <td><label for="newPassword">New Password:</label></td>
                            <td><input type="password" id="newPassword" name="newPassword"></td>
                        </tr>
                        <tr>
                            <td><label for="confirmPassword">Confirm Password:</label></td>
                            <td><input type="password" id="confirmPassword" name="confirmPassword"></td>
                        </tr>
                    </table>
                    <input type="submit" value="UPDATE PASSWORD">
                </form>
            </div>

            <div class="profileSection">
                <h3>Delivery Address</h3>
                <form>
                    <table>
                        <tr>
                            <td><label for="street">Street Address:</label></td>
                            <td><input type="text" id="street" name="street" ></td>
                        </tr>
                        <tr>
                            <td><label for="city">Area / City:</label></td>
                            <td><input type="text" id="city" name="city" ></td>
                        </tr>
                    </table>
                    <input type="submit" value="SAVE ADDRESS">
                </form>
            </div>

            <div class="profileSection danger">
                <h3>Delete Account</h3>
                <p class="smallText">Type DELETE to confirm account deletion.</p>
                <br>
                <input type="text" placeholder="Type DELETE">
                <br><br>
                <button type="button">DELETE MY ACCOUNT</button>
            </div>
        </div>
    </body>
</html>
