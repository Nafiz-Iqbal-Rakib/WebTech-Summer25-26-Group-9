<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>MiniMart - Forgot Password</title>
        <link rel="stylesheet" href="../Design/Style.css">
    </head>
    <body>
        <div class="saleBar">New Year sale | 44% Off</div>

        <div class="header">
            <div class="logo">Arabi</div>
            <div class="nav">
                <a href="Login.html">LOGIN</a>
            </div>
        </div>

        <div class="smallContainer">
            <p class="smallText">ACCOUNT</p>
            <h1>Forgot Password</h1>

            <form>
                <table>
                    <tr>
                        <td><label for="email">Email Address:</label></td>
                    </tr>
                    <tr>
                        <td><input type="email" id="email" name="email" placeholder="you@example.com"></td>
                    </tr>
                    <tr>
                        <td><label>Verification Code:</label></td>
                    </tr>
                    <tr>
                        <td>
                            <div class="codeBox"></div>
                            <div class="codeBox"></div>
                            <div class="codeBox"></div>
                            <div class="codeBox"></div>
                            <div class="codeBox"></div>
                            <div class="codeBox"></div>
                        </td>
                    </tr>
                    <tr>
                        <td><label for="newPassword">New Password:</label></td>
                    </tr>
                    <tr>
                        <td><input type="password" id="newPassword" name="newPassword" placeholder="New password"></td>
                    </tr>
                    <tr>
                        <td><label for="confirmPassword">Confirm Password:</label></td>
                    </tr>
                    <tr>
                        <td><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password"></td>
                    </tr>
                    <tr>
                        <td><input class="fullButton" type="submit" value="RESET PASSWORD"></td>
                    </tr>
                </table>
            </form>

            <p class="centerText smallText">Remembered it? <a class="formLink" href="Login.html">Log in</a></p>
        </div>
    </body>
</html>
